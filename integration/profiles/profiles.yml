default:
  target: integration-local

  outputs:
    integration-local:
      type: bigquery
      method: oauth
      project:  "{{ env_var('DBT_PROJECT', 'at-dry-run-integration-dev') }}"
      schema: dry_run
      location: EU
      threads: 8
      timeout_seconds: 300

    integration-github:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_PROJECT', 'at-dry-run-integration-dev') }}"
      schema: dry_run
      location: EU
      threads: 8
      timeout_seconds: 300
      keyfile: "{{ env_var('HOME', '/home') }}/bq_svc.json"